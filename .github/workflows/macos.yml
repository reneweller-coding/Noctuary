# Noctuary for macOS (02.10.2026): built on GitHub's Apple Silicon runners, since nobody here has a Mac.
#
# A tag v* (the release, Deploy/publish_release.ps1) or "Run workflow" by hand: the core, the tests and the plugin --
# VST3 and the standalone app, arm64 -- built in Release, the quick tests run, both bundles signed ad hoc (codesign -s -:
# no Apple developer account, so not notarized: macOS asks once, see README-macOS.txt in the zip), zipped, kept as the
# run's artifact and, for a tag, attached to its release once the release exists. JUCE and Ableton Link are fetched by
# cmake/Family.cmake. Nobody waits for it: it runs beside the Windows release.
name: macos

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Release, arm64, the plugin and the tools)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DAMBIENT_BUILD_PLUGIN=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test (the quick ones)
        env:
          AMBIENT_MUTE: "1"
        run: ctest --test-dir build -LE "slow|docs|sound" --output-on-failure

      - name: Package (signed ad hoc)
        run: |
          version=$(sed -nE 's/^project\(Noctuary VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          app=$(find build -path "*_artefacts*" -name "Noctuary.app" -maxdepth 6 | head -1)
          vst=$(find build -path "*_artefacts*" -name "Noctuary.vst3" -maxdepth 6 | head -1)
          test -n "$app" && test -n "$vst"
          out="dist/Noctuary"
          mkdir -p "$out"
          cp -R "$app" "$vst" "$out/"
          mkdir -p "$out/Packs" "$out/Journeys"
          cp Library/Packs/*.ambientpack "$out/Packs/"
          cp Library/Journeys/*.journey "$out/Journeys/"
          test "$(ls "$out/Packs" | wc -l)" -gt 0
          codesign --force --deep -s - "$out/Noctuary.app"
          codesign --force --deep -s - "$out/Noctuary.vst3"
          cp LICENSE "$out/LICENSE.txt"
          if [ -f docs/manual/Noctuary-Manual.pdf ]; then cp docs/manual/Noctuary-Manual.pdf "$out/"; fi
          cat > "$out/README-macOS.txt" <<'EOF'
          Noctuary for macOS (Apple Silicon)

          Noctuary.app      the standalone: drag it into Applications.
          Noctuary.vst3     the plugin: copy it into ~/Library/Audio/Plug-Ins/VST3 (or /Library/Audio/Plug-Ins/VST3).

          The app and the plugin are signed ad hoc, not notarized (that needs a paid Apple developer account). macOS
          therefore asks once: open the app with a right click > Open > Open. For the plugin, or if macOS refuses:
              xattr -dr com.apple.quarantine "/path/to/Noctuary.app"
              xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/Noctuary.vst3
          Built on GitHub's runners and not yet tried on a Mac by its author -- reports are welcome.

          Packs/          the preset library (*.ambientpack) and
          Journeys/       the journeys: copy both folders into ~/Documents/Noctuary/ -- the app and the plugin
                          read ~/Documents/Noctuary/Packs and ~/Documents/Noctuary/Journeys.
          The sample library the packs name (Textures, FieldRecordings, Wavetables, Impulses, Archive) is a separate
          download on the release "library-v5" of github.com/reneweller-coding/Noctuary; unzip its archives into
          ~/Documents/Noctuary/ as well. Without it the presets fall back to the built-in sources and still play.
          EOF
          sed -i '' 's/^          //' "$out/README-macOS.txt"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent "Noctuary" "Noctuary-$version-macOS.zip")
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Noctuary-macOS
          path: dist/*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 60; done
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
